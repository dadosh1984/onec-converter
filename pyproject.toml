[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onec-converter"
# версия берётся из onec_converter.__version__ (единый источник, см. [tool.setuptools.dynamic])
dynamic = ["version"]
description = "Перенос данных между информационными базами 1С (MCP-сервер + CLI)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "onec-converter contributors" }]
keywords = ["1c", "1с", "onec", "1cd", "mcp", "migration", "1e-конвертация"]
classifiers = [
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # mcp: 1.x (2.x переписан — mcp.server.fastmcp удалён); порт на 2.x — отдельная работа
    "mcp>=1.9,<2.0",
    "olefile>=0.47",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "PyYAML>=6.0",  # dump_metadata(fmt='yaml')
]

[project.urls]
Repository = "https://github.com/dadosh1984/onec-converter"

[project.optional-dependencies]
dev = [
    "pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10",
    "types-olefile", "types-openpyxl", "hypothesis>=6",
]

[project.scripts]
onec-converter = "onec_converter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "onec_converter.__version__"}

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Даты 1С хранятся без часового пояса — DTZ001/DTZ007 намеренно отключены
ignore = ["DTZ001", "DTZ007"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.onec-gates]
# Модули порога покрытия (Фаза 23; расширено в Фазе 44 на модули 32-40).
coverage_modules = [
    "objects_filter", "jwt_auth", "cache", "http_client", "mcp_server",
    "audit", "clone_db", "health", "s3_client", "sql_source", "ai_skills",
    "kd3_export", "sonar_report", "gdpr_152_report", "source_techlog",
    "notify", "terminal", "strict", "type_priority",
]
coverage_threshold = 70