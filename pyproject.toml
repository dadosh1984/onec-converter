[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onec-converter"
version = "0.1.0"
description = "MCP-сервер переноса данных между информационными базами 1С"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "olefile>=0.47",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Даты 1С хранятся без часового пояса — DTZ001/DTZ007 намеренно отключены
ignore = ["DTZ001", "DTZ007"]

[tool.mypy]
python_version = "3.11"
strict = true
