[pytest]
testpaths = tests
pythonpath = src
markers =
    integration: тесты на реальных базах (read-only копии)

# Для больших баз (копии реальных .1CD) временные файлы могут занять много
# места. Задайте базовый каталог tmp на диск с достаточным объёмом, напр.:
#   set PYTEST_ADDOPTS=--basetemp=E:\test\.pytest-tmp   (Windows)
#   PYTEST_ADDOPTS=--basetemp=/tmp/onec-pytest         (Linux/macOS)
# Сам `pytest.ini` переносим и не зависит от дисков конкретной машины.
