openapi: 3.0.3
info:
  title: onec-converter receiver (1С HTTP-сервис)
  description: >-
    Приёмник переноса данных: HTTP-сервис 1С (расширение
    extension_83). Спека сгенерирована из кода — scripts/gen_openapi.py.
  version: 0.25.0
servers:
  - url: https://{host}/hsp/onec-converter
    variables:
      host:
        default: localhost
paths:
  /metadata:
    get:
      operationId: МетаданныеИБ
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Успешный ответ JSON
        '401':
          description: Неверный ключ/токен
  /load:
    post:
      operationId: ЗаписьДанных
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Успешный ответ JSON
        '401':
          description: Неверный ключ/токен
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
