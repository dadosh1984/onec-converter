name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dev deps
        run: pip install -e ".[dev]"

      - name: ruff
        run: bash scripts/gates.sh ruff

      - name: mypy (strict)
        run: bash scripts/gates.sh mypy

      - name: pytest (unit)
        run: bash scripts/gates.sh pytest
