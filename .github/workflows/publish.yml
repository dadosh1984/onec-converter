name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия для публикации (напр. 0.23.0)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify tag matches version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          EXPECTED=$(python -c 'from onec_converter import __version__; print(__version__)')
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Тег v$TAG, а версия пакета $EXPECTED — не совпадают"
            exit 1
          fi
          echo "OK: тег v$TAG == версия $EXPECTED"

      - name: Install build tools
        run: pip install build twine

      - name: Build
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Publish to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_TOKEN }}
        run: python -m twine upload --repository testpypi dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload dist/*

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "См. CHANGELOG.md — публикация по тегу $VERSION." \
            dist/*.tar.gz dist/*.whl || echo "релиз уже существует"
