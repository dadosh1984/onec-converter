# Пример связки onec-converter + MinIO (Фаза 38).
# Предоставляет локальный S3-эндпоинт для --s3-экспорта отчётов (dump-report).
# Запуск: docker compose up -d
# Экспорт: onec-converter dump-report --file report.json \
#   --s3 onec-reports --endpoint http://localhost:9000 --key minioadmin --secret minioadmin
services:
  minio:
    image: minio/minio:latest
    container_name: onec-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  onec-converter:
    image: # заполните имя вашего образа (onec-converter:ci) или соберите: docker build -t onec-converter:ci .
    build: .
    container_name: onec-cli
    command: ["--help"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin

volumes:
  minio-data:
